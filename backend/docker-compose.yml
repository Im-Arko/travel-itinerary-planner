services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travel_api
    restart: unless-stopped
    env_file: ./.env.docker
    environment:
      HF_HOME: /app/model_cache
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - model_cache:/app/model_cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers --limit-concurrency 100

volumes:
  model_cache:
    driver: local
